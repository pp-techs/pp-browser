name: Release

# Release flow (docs/release-process.md). Every push to main runs `plan`:
#
# - changesets pending → `version` opens or updates the "Version Packages" PR
#   (`vp run version-packages`: lockstep bump of every workspace package, CHANGELOGs, root version);
# - no changesets, the root CHANGELOG has a section for the committed version, and that version has
#   no GitHub Release yet → `verify` checks the commit, `package` builds the installers on macOS,
#   Windows, and Linux, and `publish` (environment `release`) tags vX.Y.Z and creates the GitHub
#   Release with the installers and their SHA-256 checksums;
# - otherwise nothing.
#
# Merging the Version Packages PR is the release. A failed run is retried by re-running the failed
# jobs: an existing tag or Release is left alone.
#
# Builds are ad-hoc signed (no code-signing secrets configured); macOS users right-click → Open the
# first time. See docs/release-process.md for adding signing/notarization later.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select mode
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version package.json)
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md | wc -l)
          mode=none
          if [ "$pending" -gt 0 ]; then
            mode=version
          elif grep -qF "## [$version]" CHANGELOG.md; then
            # Exit 0 = the Release exists; a 404 = not yet; anything else must not guess.
            if out=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" 2>&1); then
              :
            elif grep -q 'HTTP 404' <<< "$out"; then
              mode=publish
            else
              echo "::error::could not look up release v$version: $out"
              exit 1
            fi
          fi
          echo "$pending pending changesets, version $version → mode $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  version:
    name: Version Packages PR
    needs: plan
    if: needs.plan.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true

      # The PR is created with GITHUB_TOKEN, so CI does not run on it; `verify` re-runs the checks
      # on the merged commit before anything is published. Needs "Allow GitHub Actions to create
      # and approve pull requests" in the repository settings.
      - name: Create or update the Version Packages PR
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: vp run version-packages
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"

  verify:
    name: Verify release
    needs: plan
    if: needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check lockstep versions
        run: |
          for manifest in package.json apps/cli/package.json apps/desktop/package.json apps/web/package.json \
                          packages/core/package.json packages/shared/package.json packages/mcp/package.json packages/server/package.json; do
            actual=$(jq -r .version "$manifest")
            if [ "$actual" != "$VERSION" ]; then
              echo "::error file=$manifest::version $actual, expected $VERSION"
              exit 1
            fi
          done

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true

      - name: Check (format, lint, typecheck)
        run: vp check

      - name: Extract release notes
        run: |
          mkdir -p "$RUNNER_TEMP/notes"
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes/notes.md"; then
            echo "::error file=CHANGELOG.md::no section for [$VERSION]"
            exit 1
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package (${{ matrix.name }})
    needs: [plan, verify]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      # Let every platform finish so one failure shows all problems; `publish` still needs all.
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-latest
            platform: macos-arm64
            bundles: dmg
            artifact: installers-mac-arm64
          - name: macOS x64
            runner: macos-15-intel
            platform: macos-x64
            bundles: dmg
            artifact: installers-mac-x64
          - name: Windows x64
            runner: windows-latest
            platform: windows-x64
            bundles: nsis
            artifact: installers-win-x64
          - name: Linux x64
            runner: ubuntu-latest
            platform: linux-x64
            bundles: appimage,deb
            artifact: installers-linux-x64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Build renderer and daemon
        run: vp run -r build

      - name: Make installers
        working-directory: apps/desktop
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: vp exec tauri build --bundles "${{ matrix.bundles }}"

      # Give the release assets the stable `pp-browser-<version>-<os>-<arch>.<ext>` names
      # regardless of Tauri's default naming.
      - name: Collect installers
        shell: bash
        working-directory: apps/desktop
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          out="$RUNNER_TEMP/installers"
          mkdir -p "$out"
          bundle=src-tauri/target/release/bundle
          shopt -s nullglob
          for f in "$bundle"/dmg/*.dmg "$bundle"/nsis/*-setup.exe "$bundle"/appimage/*.AppImage "$bundle"/deb/*.deb; do
            ext="${f##*.}"
            mv "$f" "$out/pp-browser-$VERSION-$PLATFORM.$ext"
          done
          shopt -u nullglob
          count=$(find "$out" -type f | wc -l)
          [ "$count" -gt 0 ] || { echo "::error::no installers produced"; find "$bundle" -type f; exit 1; }
          ls -l "$out"

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/installers
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [plan, verify, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Add required reviewers to this environment (Settings → Environments) for a human gate.
    environment: release
    permissions:
      contents: write # tag + GitHub Release
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      # No checkout: this job only handles the verified artifacts.
      - name: Download installers and notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/release

      - name: Collect assets
        id: assets
        run: |
          assets="$RUNNER_TEMP/assets"
          mkdir -p "$assets"
          find "$RUNNER_TEMP/release" -path '*/installers-*/*' -type f -exec mv {} "$assets/" \;
          (cd "$assets" && sha256sum -- * > SHA256SUMS.txt)
          ls -l "$assets"
          echo "dir=$assets" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSETS: ${{ steps.assets.outputs.dir }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "GitHub Release $tag already exists"
            exit 0
          fi
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "pp-browser $tag" \
            --notes-file "$RUNNER_TEMP/release/release-notes/notes.md" \
            "${prerelease[@]}" \
            "$ASSETS"/*
